<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Watchlist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#050505; color:#F2F0EC; font-family:'Oswald',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#C9962C; text-decoration:none; }
  a:hover { color:#E8B94A; }
  ::selection { background:#C9962C; color:#050505; }
</style>
</helmet>

<div style="min-height:100vh; background:#050505; padding:0 0 90px">

  <div style="display:flex; flex-direction:column; align-items:center; gap:14px; padding:34px 20px 22px">
    <div style="font-size:11px; letter-spacing:.42em; color:#8A8377; text-transform:uppercase">Not booked yet</div>
    <div style="font-size:13px; letter-spacing:.2em; color:#C9962C; text-transform:uppercase">Gigs on the radar</div>
  </div>

  <div style="width:min(94vw,980px); margin:26px auto 0">
    <div style="display:grid; gap:1px; background:#221F1B; border:1px solid #221F1B">
      <sc-for list="{{ sortedGigs }}" as="gig" hint-placeholder-count="7">
        <div style="background:#0C0B0A; padding:22px 20px">
          <div style="display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 20px">
            <span style="font-size:17px; letter-spacing:.03em; color:#F2F0EC">{{ gig.name }}</span>
            <span style="font-size:12px; letter-spacing:.06em; color:#8A8377">{{ gig.date }}</span>
          </div>
          <div style="margin-top:6px; font-size:13px; letter-spacing:.04em; color:#8A8377">{{ gig.venue }}</div>
          <div style="margin-top:14px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 20px">
            <span style="font-size:12px; letter-spacing:.04em; color:#C9962C">{{ gig.price }}</span>
            <a href="{{ gig.link }}" target="_blank" rel="noopener" style="font-size:11px; letter-spacing:.18em; text-transform:uppercase; border:1px solid #2C2A26; padding:9px 16px" style-hover="border-color:#C9962C">Tickets</a>
          </div>
          <sc-if value="{{ gig.note }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:10px; font-size:12px; letter-spacing:.03em; color:#5C574E; line-height:1.5">{{ gig.note }}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="text-align:center; margin-top:60px; font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:#5C574E">Prices and on-sale status move — check before buying</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const GIGS = [
  { name: 'The Strokes + Beck', venue: 'Sydney Summertime, Centennial Park, Sydney', date: 'Sat 20 Feb 2027',
    link: 'https://www.theaureview.com/music/the-strokes-australian-tour-2027/',
    price: 'From $132.48 + fees',
    note: 'Beck is confirmed for the Sydney date only, not the full tour. Sources disagree on seller — Ticketmaster, Live Nation and Moshtix are all named; check the official Sydney Summertime page before buying.' },
  { name: 'Hard-Ons + Jerry A', venue: 'The Ed Castle, Adelaide', date: 'Fri 5 Mar 2027',
    link: 'https://www.moshtix.com.au/v2/event/hard-ons-with-jerry-a-%E2%80%94-adelaide/201675',
    price: '$63.75 GA (7:30pm, sales close 6:30pm on the night)',
    note: 'Part of a 13-date national tour. Clashes with the Kings of Leon Melbourne date below — same night.' },
  { name: 'Kings of Leon + Ocean Alley', venue: 'Flemington Racecourse, Melbourne', date: 'Fri 5 Mar 2027',
    link: 'https://tixel.com/au/news/2026/10/19/kings-of-leon-announce-2027-australia-and',
    price: 'General sale Tue 27 Oct, via Moshtix — price TBC',
    note: 'No Adelaide date on this tour — closest options are Sydney (Centennial Park, Sun 28 Feb) or Brisbane (Showgrounds, Wed 3 Mar) if Melbourne doesn\'t suit. Clashes with Hard-Ons at Ed Castle above.' },
  { name: 'A Perfect Circle + Puscifer', venue: 'The Drive, Adelaide', date: 'Fri 4 Dec 2026',
    link: 'https://www.thedriveadelaide.com.au/events/a-perfect-circle/',
    price: 'Resale from ~$69 (official on-sale closed 20 Mar 2026)',
    note: 'Face-value sale has passed — remaining tickets are resale (Tixel, Viagogo, StubHub). Check the official page first in case of released holds.' },
  { name: 'Tash Sultana', venue: 'Hindley St Music Hall, Adelaide', date: 'Mon 10 May 2027',
    link: 'https://moshtix.com.au/v2/event/tash-sultana/200619',
    price: '$89.90 GA 18+ (7:00pm)',
    note: 'Part of a 7-date AU/NZ tour.' },
  { name: 'Guns N\' Roses + Airbourne', venue: 'Adelaide Street Circuit, Adelaide', date: 'Sun 29 Nov 2026',
    link: 'https://www.stereoboard.com/guns-n-roses-tickets/adelaide/2026-11-29',
    price: 'Resale from $189',
    note: 'The bp Adelaide Grand Final Sunday Concert. Official Ticketmaster sale has passed, so this is resale pricing.' },
  { name: 'Garage Days: Spiderbait + Jebediah + more', venue: 'Richard Hamilton Wines, McLaren Vale', date: 'Sat 6 Feb 2027',
    link: 'https://www.theaureview.com/music/garage-days-festival-2027-mclaren-vale/',
    price: 'Early Bird from $99 + fee (first 500 only) — check current price, general sale opened 6 Oct 2026',
    note: 'Inaugural day festival, 3pm–10pm, all ages. Also on the bill: The Potbelleez, Gyroscope, The Delta Riggs, The Lizards, JAKIJ. No confirmed ticketing platform found — check the official announcement or venue site.' }
];

class Component extends DCLogic {
  renderVals() {
    const MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
    const dateKey = d => {
      const [, day, mon, year] = d.split(' ');
      const t = new Date(+year, MONTHS[mon], +day).getTime();
      return isNaN(t) ? Infinity : t;
    };
    const sortedGigs = GIGS.slice().sort((a, b) => dateKey(a.date) - dateKey(b.date));
    return { sortedGigs };
  }
}
</script>
</body>
</html>
